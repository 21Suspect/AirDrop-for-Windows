name: Receiver and firmware tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  receiver:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install receiver and test dependencies
        run: python -m pip install -e . pytest
      - name: Test receiver protocol (no radio)
        run: python -m pytest tests/windows -q
      - name: Build portable firmware parser (no driver installation)
        run: |
          cmake -S native/intel -B build/native
          cmake --build build/native --config Release
      - name: Test native firmware parser (no hardware)
        run: python -m pytest tests/native -q

  awdl-adapters:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/awdl/Cargo.toml -- --check
      - name: Test shared packet codecs and AWDL queues (no hardware)
        run: cargo test --locked --manifest-path native/awdl/Cargo.toml
      - name: Lint Windows adapters
        run: cargo clippy --locked --manifest-path native/awdl/Cargo.toml --all-targets -- -D warnings
